<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>区域列生成器</title>
  <script src="./xlsx-lite.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #19212a;
      --muted: #687381;
      --line: #d9e1ea;
      --soft: #f4f7fa;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --warn: #a15c07;
      --bad: #b42318;
      --good: #087443;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #eef3f7;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      min-width: 220px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label,
    .label {
      font-size: 13px;
      font-weight: 700;
      color: #2d3743;
    }

    input[type="file"],
    select,
    textarea,
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    input[type="file"] {
      padding: 9px;
    }

    select,
    input[type="text"] {
      height: 38px;
      padding: 0 10px;
    }

    textarea {
      min-height: 330px;
      resize: vertical;
      padding: 12px;
      font-family: Consolas, "Cascadia Mono", monospace;
      line-height: 1.55;
      white-space: pre;
    }

    textarea.compact {
      min-height: 160px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 1px solid transparent;
      border-radius: 7px;
      height: 38px;
      padding: 0 13px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      color: var(--ink);
      background: #fff;
      border-color: var(--line);
    }

    button.secondary:hover {
      background: var(--soft);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--soft);
    }

    .metric b {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .preview {
      max-height: 340px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
      background: #fff;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #edf4f7;
      font-weight: 800;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 9px;
      background: #e8f5f2;
      color: #075e54;
      font-size: 12px;
      font-weight: 700;
    }

    .message {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .message.bad {
      color: var(--bad);
    }

    .message.good {
      color: var(--good);
    }

    .message.warn {
      color: var(--warn);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        align-items: stretch;
        flex-direction: column;
      }

      .status {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>区域列生成器</h1>
        <div class="sub">本地读取 Excel，直接生成可复制的区域结果，也可查看对应公式。</div>
      </div>
      <div class="status" id="status">等待上传</div>
    </header>

    <section class="grid">
      <aside class="panel stack">
        <div class="field">
          <label for="sourceFile">待处理表</label>
          <input id="sourceFile" type="file" accept=".xlsx,.xlsm,.csv">
        </div>

        <div class="field">
          <label for="mapFile">地区总表</label>
          <input id="mapFile" type="file" accept=".xlsx,.xlsm,.csv">
          <div class="hint">可不传；若待处理表里已有“地级/省份/区域”sheet，会自动使用。</div>
        </div>

        <div class="row">
          <div class="field">
            <label for="sourceSheet">业务 sheet</label>
            <select id="sourceSheet"></select>
          </div>
          <div class="field">
            <label for="mapSheet">总表 sheet</label>
            <select id="mapSheet"></select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="nameColumn">机构列</label>
            <select id="nameColumn"></select>
          </div>
          <div class="field">
            <label for="firstDataRow">首行数据</label>
            <input id="firstDataRow" type="text" value="2" inputmode="numeric">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="mapKeyColumn">匹配列</label>
            <select id="mapKeyColumn"></select>
          </div>
          <div class="field">
            <label for="mapAreaColumn">区域列</label>
            <select id="mapAreaColumn"></select>
          </div>
        </div>

        <div class="field">
          <label for="outputSheetName">导出总表名</label>
          <input id="outputSheetName" type="text" value="地区总表">
        </div>

        <div class="actions">
          <button id="generateBtn" disabled>生成</button>
          <button class="secondary" id="copyResultBtn" disabled>复制结果</button>
          <button class="secondary" id="copyFormulaBtn" disabled>复制公式</button>
          <button class="secondary" id="downloadBtn" disabled>下载 Excel</button>
        </div>

        <div class="message" id="message"></div>
      </aside>

      <section class="stack">
        <div class="metrics">
          <div class="metric">
            <b id="rowCount">0</b>
            <span>数据行</span>
          </div>
          <div class="metric">
            <b id="mapCount">0</b>
            <span>总表词条</span>
          </div>
          <div class="metric">
            <b id="previewCount">0</b>
            <span>预览行</span>
          </div>
          <div class="metric">
            <b id="unmatchedCount">0</b>
            <span>未匹配</span>
          </div>
        </div>

        <div class="panel stack">
          <div class="actions">
            <span class="pill">区域结果</span>
            <span class="hint">粘贴到 Excel 的 A 列；首格是表头，下面是直接结果。</span>
          </div>
          <textarea id="resultText" spellcheck="false" readonly></textarea>
        </div>

        <div class="panel stack">
          <div class="actions">
            <span class="pill">对应公式</span>
            <span class="hint">需要检查逻辑时复制这一列；首格是表头，下面是公式。</span>
          </div>
          <textarea class="compact" id="formulaText" spellcheck="false" readonly></textarea>
        </div>

        <div class="panel stack">
          <div class="actions">
            <span class="pill">未匹配行</span>
            <span class="hint">显示行号和机构名，少量未匹配可手动补。</span>
          </div>
          <textarea class="compact" id="unmatchedText" spellcheck="false" readonly></textarea>
        </div>

        <div class="panel stack">
          <div class="actions">
            <span class="pill">预览</span>
            <span class="hint" id="previewHint">选择文件后显示</span>
          </div>
          <div class="preview" id="preview"></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const els = {
      sourceFile: document.getElementById("sourceFile"),
      mapFile: document.getElementById("mapFile"),
      sourceSheet: document.getElementById("sourceSheet"),
      mapSheet: document.getElementById("mapSheet"),
      nameColumn: document.getElementById("nameColumn"),
      firstDataRow: document.getElementById("firstDataRow"),
      mapKeyColumn: document.getElementById("mapKeyColumn"),
      mapAreaColumn: document.getElementById("mapAreaColumn"),
      outputSheetName: document.getElementById("outputSheetName"),
      generateBtn: document.getElementById("generateBtn"),
      copyResultBtn: document.getElementById("copyResultBtn"),
      copyFormulaBtn: document.getElementById("copyFormulaBtn"),
      downloadBtn: document.getElementById("downloadBtn"),
      resultText: document.getElementById("resultText"),
      formulaText: document.getElementById("formulaText"),
      preview: document.getElementById("preview"),
      previewHint: document.getElementById("previewHint"),
      rowCount: document.getElementById("rowCount"),
      mapCount: document.getElementById("mapCount"),
      previewCount: document.getElementById("previewCount"),
      unmatchedCount: document.getElementById("unmatchedCount"),
      unmatchedText: document.getElementById("unmatchedText"),
      status: document.getElementById("status"),
      message: document.getElementById("message")
    };

    const state = {
      sourceWorkbook: null,
      sourceFileName: "",
      mapWorkbook: null,
      mapEntries: [],
      generated: null
    };

    const columnHints = ["网点", "营业部", "分公司", "机构", "销售商", "渠道", "名称"];
    const strongColumnHints = ["网点", "营业部", "分公司", "一级分公司", "二级分公司"];
    const badColumnHints = ["产品", "代码", "金额", "保有", "销量", "赎回", "份额", "日期", "类型"];
    const mapKeyHints = ["地级", "城市", "市", "区县", "县", "省份"];
    const areaHints = ["区域", "地区", "片区"];

    function setMessage(text, type = "") {
      els.message.textContent = text;
      els.message.className = `message ${type}`.trim();
    }

    function setStatus(text) {
      els.status.textContent = text;
    }

    function readWorkbook(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async event => {
          try {
            const workbook = await XLSX.read(event.target.result, { type: "array", cellFormula: true });
            resolve(workbook);
          } catch (error) {
            reject(error);
          }
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
      });
    }

    function sheetRows(workbook, sheetName) {
      if (!workbook || !sheetName) return [];
      const sheet = workbook.Sheets[sheetName];
      return XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
    }

    function headerOf(workbook, sheetName) {
      const rows = sheetRows(workbook, sheetName);
      return rows[0] || [];
    }

    function sheetRange(workbook, sheetName) {
      const sheet = workbook && workbook.Sheets[sheetName];
      if (!sheet || !sheet["!ref"]) return null;
      return XLSX.utils.decode_range(sheet["!ref"]);
    }

    function fillSelect(select, items, formatter = item => item, selectedIndex = 0) {
      select.innerHTML = "";
      items.forEach((item, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = formatter(item, index);
        select.appendChild(option);
      });
      if (items.length) select.value = String(Math.max(0, selectedIndex));
    }

    function bestIndex(headers, hints, fallback = 0) {
      const normalized = headers.map(value => String(value || "").trim());
      for (const hint of hints) {
        const index = normalized.findIndex(value => value.includes(hint));
        if (index >= 0) return index;
      }
      return fallback;
    }

    function normalizeText(value) {
      return String(value == null ? "" : value).trim();
    }

    function isLikelyMapKey(value) {
      const text = normalizeText(value);
      return text.length >= 2 && /[\u4e00-\u9fff]/.test(text) && !/[A-Za-zА-Яа-яЁё]/.test(text);
    }

    function mapEntries() {
      const rows = sheetRows(mapWorkbook(), mapSheetName());
      const keyIndex = Number(els.mapKeyColumn.value || 0);
      const areaIndex = Number(els.mapAreaColumn.value || 0);
      return rows.slice(1)
        .map(row => ({
          key: normalizeText(row[keyIndex]),
          area: normalizeText(row[areaIndex])
        }))
        .filter(item => isLikelyMapKey(item.key) && item.area);
    }

    function resolveArea(name, entries = state.mapEntries) {
      const text = normalizeText(name);
      if (!text) return "";
      const hit = entries.find(item => text.includes(item.key));
      return hit ? hit.area : "未找到";
    }

    function isSummaryName(value) {
      const text = normalizeText(value);
      return text === "合计" || text === "总计" || text === "汇总";
    }

    function bestNameColumnIndex() {
      const rows = sheetRows(state.sourceWorkbook, sourceSheetName());
      const headers = rows[0] || [];
      const fallback = bestIndex(headers, columnHints, Math.min(1, Math.max(0, headers.length - 1)));
      const entries = mapEntries();
      if (!rows.length || !entries.length) return fallback;

      let best = { index: fallback, score: -1 };
      headers.forEach((header, index) => {
        const headerText = normalizeText(header);
        let score = columnHints.some(hint => headerText.includes(hint)) ? 20 : 0;
        if (strongColumnHints.some(hint => headerText.includes(hint))) score += 45;
        if (badColumnHints.some(hint => headerText.includes(hint))) score -= 80;
        const sampleRows = rows.slice(1, Math.min(rows.length, 80));
        for (const row of sampleRows) {
          const value = normalizeText(row[index]);
          if (!value) continue;
          const area = resolveArea(value, entries);
          if (area !== "未找到") score += 3;
          if (value.includes("营业部") || value.includes("分公司")) score += 5;
          if (value.includes("证券")) score += 1;
        }
        if (score > best.score) best = { index, score };
      });
      return best.index;
    }

    function looksLikeMapSheet(workbook, sheetName) {
      const headers = headerOf(workbook, sheetName).map(value => String(value).trim());
      return headers.some(value => value.includes("区域")) &&
        (headers.some(value => value.includes("地级")) || headers.some(value => value.includes("省份")));
    }

    function sourceSheetName() {
      return state.sourceWorkbook ? state.sourceWorkbook.SheetNames[Number(els.sourceSheet.value)] : "";
    }

    function mapWorkbook() {
      return state.mapWorkbook || state.sourceWorkbook;
    }

    function mapSheetName() {
      const workbook = mapWorkbook();
      return workbook ? workbook.SheetNames[Number(els.mapSheet.value)] : "";
    }

    function sourceHasRegionColumn() {
      const headers = headerOf(state.sourceWorkbook, sourceSheetName());
      return String(headers[0] || "").trim().includes("区域");
    }

    function finalNameColumnLetter() {
      const sourceIndex = Number(els.nameColumn.value);
      const finalIndex = sourceHasRegionColumn() ? sourceIndex : sourceIndex + 1;
      return XLSX.utils.encode_col(finalIndex);
    }

    function selectedColumnLetter(select) {
      return XLSX.utils.encode_col(Number(select.value));
    }

    function mapLastRowNumber() {
      const rows = sheetRows(mapWorkbook(), mapSheetName());
      return Math.max(2, rows.length);
    }

    function quotedSheet(name) {
      return "'" + String(name).replace(/'/g, "''") + "'";
    }

    function refreshSourceControls() {
      if (!state.sourceWorkbook) return;
      const names = state.sourceWorkbook.SheetNames;
      const selected = names.findIndex(name => !looksLikeMapSheet(state.sourceWorkbook, name));
      fillSelect(els.sourceSheet, names, name => name, selected >= 0 ? selected : 0);
      refreshNameColumns();
    }

    function refreshMapControls() {
      const workbook = mapWorkbook();
      if (!workbook) {
        fillSelect(els.mapSheet, []);
        fillSelect(els.mapKeyColumn, []);
        fillSelect(els.mapAreaColumn, []);
        return;
      }
      const names = workbook.SheetNames;
      const selected = names.findIndex(name => looksLikeMapSheet(workbook, name));
      fillSelect(els.mapSheet, names, name => name, selected >= 0 ? selected : 0);
      if (names.length) els.outputSheetName.value = mapSheetName();
      refreshMapColumns();
    }

    function refreshNameColumns() {
      const headers = headerOf(state.sourceWorkbook, sourceSheetName());
      fillSelect(els.nameColumn, headers, (value, index) => `${XLSX.utils.encode_col(index)}：${value || "(空表头)"}`, bestNameColumnIndex());
      updatePreview();
    }

    function refreshMapColumns() {
      const headers = headerOf(mapWorkbook(), mapSheetName());
      fillSelect(els.mapKeyColumn, headers, (value, index) => `${XLSX.utils.encode_col(index)}：${value || "(空表头)"}`, bestIndex(headers, mapKeyHints, 0));
      fillSelect(els.mapAreaColumn, headers, (value, index) => `${XLSX.utils.encode_col(index)}：${value || "(空表头)"}`, bestIndex(headers, areaHints, Math.min(2, headers.length - 1)));
      state.mapEntries = mapEntries();
      refreshNameColumns();
      updatePreview();
    }

    function updateReadyState() {
      const ready = Boolean(state.sourceWorkbook && mapWorkbook() && els.nameColumn.options.length && els.mapKeyColumn.options.length && els.mapAreaColumn.options.length);
      els.generateBtn.disabled = !ready;
      if (ready) setStatus("已就绪");
    }

    function buildLookupFormula(rowNumber) {
      const nameLetter = finalNameColumnLetter();
      const keyLetter = selectedColumnLetter(els.mapKeyColumn);
      const areaLetter = selectedColumnLetter(els.mapAreaColumn);
      const sheet = quotedSheet(els.outputSheetName.value.trim() || mapSheetName());
      const lastMapRow = mapLastRowNumber();
      const keyRange = `${sheet}!$${keyLetter}$2:$${keyLetter}$${lastMapRow}`;
      const areaRange = `${sheet}!$${areaLetter}$2:$${areaLetter}$${lastMapRow}`;
      return `=IFERROR(XLOOKUP(TRUE,ISNUMBER(SEARCH(${keyRange},${nameLetter}${rowNumber})),${areaRange}),"未找到")`;
    }

    function buildFormula(rowNumber, firstDataRow = 2) {
      const nameLetter = finalNameColumnLetter();
      const lookup = buildLookupFormula(rowNumber).slice(1);
      const nameCell = `${nameLetter}${rowNumber}`;
      const summaryCheck = `OR(${nameCell}="合计",${nameCell}="总计",${nameCell}="汇总")`;
      if (rowNumber <= firstDataRow) return `=IF(${summaryCheck},"",${lookup})`;
      return `=IF(${summaryCheck},"",IF(${nameCell}="",A${rowNumber - 1},${lookup}))`;
    }

    function generate() {
      const range = sheetRange(state.sourceWorkbook, sourceSheetName());
      const rows = sheetRows(state.sourceWorkbook, sourceSheetName());
      if (!range) {
        setMessage("业务 sheet 没有可读取区域。", "bad");
        return;
      }

      const firstDataRow = Number.parseInt(els.firstDataRow.value, 10);
      if (!Number.isInteger(firstDataRow) || firstDataRow < 2) {
        setMessage("首行数据需要是 2 或更大的数字。", "bad");
        return;
      }

      const lastRow = range.e.r + 1;
      state.mapEntries = mapEntries();
      const nameIndex = Number(els.nameColumn.value || 0);
      const results = ["区域"];
      const formulas = ["区域"];
      const unmatched = [];
      let lastArea = "";
      for (let row = firstDataRow; row <= lastRow; row += 1) {
        const name = rows[row - 1]?.[nameIndex] || "";
        const normalizedName = normalizeText(name);
        let area = normalizedName ? resolveArea(name) : lastArea;
        if (isSummaryName(normalizedName)) area = "";
        if (normalizedName && !isSummaryName(normalizedName) && area === "未找到") unmatched.push({ row, name: normalizedName });
        if (area && area !== "未找到") lastArea = area;
        results.push(area);
        formulas.push(buildFormula(row, firstDataRow));
      }

      els.resultText.value = results.join("\n");
      els.formulaText.value = formulas.join("\n");
      els.unmatchedText.value = unmatched.length
        ? unmatched.map(item => `第 ${item.row} 行：${item.name || "(空)"}`).join("\n")
        : "全部匹配";
      els.rowCount.textContent = Math.max(0, lastRow - firstDataRow + 1);
      els.unmatchedCount.textContent = unmatched.length;
      els.copyResultBtn.disabled = false;
      els.copyFormulaBtn.disabled = false;
      els.downloadBtn.disabled = false;
      state.generated = { results, formulas, unmatched, firstDataRow, lastRow };
      if (unmatched.length) {
        const sample = unmatched.slice(0, 3).map(item => item.row).join("、");
        setMessage(`已生成区域结果；${unmatched.length} 行未匹配，如第 ${sample} 行。`, "warn");
      } else {
        setMessage("已生成区域结果，全部匹配。", "good");
      }
      updatePreview(true);
    }

    function makeOutputWorkbook() {
      const srcName = sourceSheetName();
      const rows = sheetRows(state.sourceWorkbook, srcName);
      const firstDataRow = state.generated.firstDataRow;
      const hasRegion = sourceHasRegionColumn();
      const outputRows = rows.map((row, index) => {
        if (hasRegion) {
          const copy = row.slice();
          copy[0] = index === 0 ? "区域" : "";
          return copy;
        }
        if (index === 0) return ["区域", ...row];
        if (index + 1 < firstDataRow) return ["", ...row];
        return ["", ...row];
      });
      const outputSheet = XLSX.utils.aoa_to_sheet(outputRows);
      const mapName = els.outputSheetName.value.trim() || "地区总表";
      for (let row = firstDataRow; row <= state.generated.lastRow; row += 1) {
        const cellAddress = `A${row}`;
        outputSheet[cellAddress] = {
          t: "s",
          v: state.generated.results[row - firstDataRow + 1] || ""
        };
      }

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, outputSheet, cleanSheetName(srcName || "业务表"));
      const mapRows = sheetRows(mapWorkbook(), mapSheetName());
      const mapSheet = XLSX.utils.aoa_to_sheet(mapRows);
      XLSX.utils.book_append_sheet(workbook, mapSheet, cleanSheetName(mapName));
      return workbook;
    }

    function cleanSheetName(name) {
      const cleaned = String(name || "Sheet").replace(/[\\/?*[\]:]/g, " ").slice(0, 31).trim();
      return cleaned || "Sheet";
    }

    async function copyResultOutput() {
      await navigator.clipboard.writeText(els.resultText.value);
      setMessage("区域结果已复制。", "good");
    }

    async function copyFormulaOutput() {
      await navigator.clipboard.writeText(els.formulaText.value);
      setMessage("公式列已复制。", "good");
    }

    async function downloadOutput() {
      const workbook = makeOutputWorkbook();
      const base = state.sourceFileName.replace(/\.[^.]+$/, "") || "区域列结果";
      await XLSX.writeFile(workbook, `${base}-区域列.xlsx`);
    }

    function updatePreview(afterGenerate = false) {
      const rows = sheetRows(state.sourceWorkbook, sourceSheetName());
      const mapRows = sheetRows(mapWorkbook(), mapSheetName());
      els.mapCount.textContent = Math.max(0, mapRows.length - 1);
      els.preview.innerHTML = "";
      if (!rows.length) {
        els.previewHint.textContent = "选择文件后显示";
        els.previewCount.textContent = "0";
        updateReadyState();
        return;
      }

      const firstDataRow = Math.max(2, Number.parseInt(els.firstDataRow.value, 10) || 2);
      const nameIndex = Number(els.nameColumn.value || 0);
      const slice = rows.slice(0, Math.min(rows.length, 16));
      const table = document.createElement("table");
      const tbody = document.createElement("tbody");
      const previewEntries = state.generated ? state.mapEntries : mapEntries();

      slice.forEach((row, rowIndex) => {
        const tr = document.createElement("tr");
        const areaValue = afterGenerate && rowIndex + 1 >= firstDataRow
          ? (state.generated?.results[rowIndex - firstDataRow + 2] || resolveArea(row[nameIndex] || "", previewEntries))
          : "";
        const displayCells = rowIndex === 0
          ? ["区域", ...row.slice(0, 5)]
          : [areaValue, ...row.slice(0, 5)];
        displayCells.forEach((value, colIndex) => {
          const cell = document.createElement(rowIndex === 0 ? "th" : "td");
          cell.textContent = String(value || "");
          if (rowIndex > 0 && colIndex === nameIndex + 1) cell.style.fontWeight = "700";
          tr.appendChild(cell);
        });
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      els.preview.appendChild(table);
      els.previewCount.textContent = Math.max(0, slice.length - 1);
      els.previewHint.textContent = sourceSheetName() || "预览";
      updateReadyState();
    }

    els.sourceFile.addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        setStatus("读取待处理表");
        state.sourceWorkbook = await readWorkbook(file);
        state.sourceFileName = file.name;
        state.generated = null;
        els.copyResultBtn.disabled = true;
        els.copyFormulaBtn.disabled = true;
        els.downloadBtn.disabled = true;
        els.resultText.value = "";
        els.formulaText.value = "";
        els.unmatchedText.value = "";
        els.unmatchedCount.textContent = "0";
        refreshSourceControls();
        refreshMapControls();
        setMessage(`已读取：${file.name}`, "good");
      } catch (error) {
        setMessage(`读取失败：${error.message}`, "bad");
        setStatus("读取失败");
      }
    });

    els.mapFile.addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) {
        state.mapWorkbook = null;
        refreshMapControls();
        return;
      }
      try {
        setStatus("读取地区总表");
        state.mapWorkbook = await readWorkbook(file);
        state.generated = null;
        els.copyResultBtn.disabled = true;
        els.copyFormulaBtn.disabled = true;
        els.downloadBtn.disabled = true;
        els.resultText.value = "";
        els.formulaText.value = "";
        els.unmatchedText.value = "";
        els.unmatchedCount.textContent = "0";
        refreshMapControls();
        setMessage(`已读取总表：${file.name}`, "good");
      } catch (error) {
        setMessage(`总表读取失败：${error.message}`, "bad");
        setStatus("读取失败");
      }
    });

    function refreshOrRegenerate(callback) {
      callback();
      if (state.generated && !els.generateBtn.disabled) generate();
    }

    els.sourceSheet.addEventListener("change", () => refreshOrRegenerate(refreshNameColumns));
    els.mapSheet.addEventListener("change", () => refreshOrRegenerate(refreshMapColumns));
    els.nameColumn.addEventListener("change", () => state.generated ? generate() : updatePreview());
    els.mapKeyColumn.addEventListener("change", () => {
      state.mapEntries = mapEntries();
      if (state.generated) generate();
      else updatePreview();
    });
    els.mapAreaColumn.addEventListener("change", () => {
      state.mapEntries = mapEntries();
      if (state.generated) generate();
      else updatePreview();
    });
    els.firstDataRow.addEventListener("input", () => state.generated ? generate() : updatePreview());
    els.outputSheetName.addEventListener("input", () => {
      if (state.generated) generate();
    });
    els.generateBtn.addEventListener("click", generate);
    els.copyResultBtn.addEventListener("click", copyResultOutput);
    els.copyFormulaBtn.addEventListener("click", copyFormulaOutput);
    els.downloadBtn.addEventListener("click", downloadOutput);

    setMessage("上传待处理表后开始。");
  </script>
</body>
</html>
